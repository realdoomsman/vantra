<!doctype html><meta charset="utf-8"><title>VANTRA — brand</title>
<style>
 :root{--ink:#0B0B0D;--bone:#EDE9E3;--dim:#6E7178;--molten:#FF5A1F;--line:#26282E}
 *{box-sizing:border-box;margin:0}
 body{background:var(--ink);color:var(--bone);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:56px clamp(24px,5vw,80px)}
 h1{font-size:44px;letter-spacing:.14em;font-weight:600}
 .rule{height:3px;width:220px;background:var(--molten);margin:18px 0 8px}
 p.lede{color:var(--dim);max-width:62ch;margin-bottom:44px}
 h2{font-size:12px;letter-spacing:.22em;color:var(--dim);font-weight:600;margin:48px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}
 figure{border:1px solid var(--line);background:#101116}
 img{width:100%;display:block}
 figcaption{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;color:var(--dim);padding:10px 12px;border-top:1px solid var(--line)}
 .sw{display:flex;gap:0;margin-top:8px;flex-wrap:wrap}
 .sw div{flex:1 1 130px;padding:22px 14px;font:11px/1.5 ui-monospace,monospace}
</style>
<h1>VANTRA</h1><div class="rule"></div>
<p class="lede">Molten orange on graphite. The mark is a burn-down — six rules narrowing to a point, the treasury spending itself until the agent dies. It reads as a V.</p>
